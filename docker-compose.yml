services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: coach
      POSTGRES_PASSWORD: coach
      POSTGRES_DB: coach
    # Port 5433 côté Mac/PC, pour ne pas entrer en conflit avec un PostgreSQL
    # déjà installé (qui occupe souvent 5432). Accessible depuis cette machine
    # uniquement.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
